# ---------------------------------------------------------------------------
#  CI - i controlli che girano su OGNI pull request.
#
#  Questo file e' INCOMPLETO: dove trovi  # TODO n  devi scrivere tu.
#  Il primo gate (segreti) e' gia' completo: usalo come esempio.
#
#  Consiglio: completa un TODO alla volta, fai commit, guarda la tab Actions.
#  Un job rosso ti dice esattamente quale riga non va.
# ---------------------------------------------------------------------------
name: CI

# TODO 1 - Oggi il workflow parte solo a mano (workflow_dispatch): lascialo,
#          e aggiungi le altre due partenze:
#            - su OGNI pull request verso main
#            - sui push diretti a main
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -------------------------------------------------- GATE 1: segreti (ESEMPIO GIA' FATTO)
  segreti:
    name: Gate segreti - niente credenziali nel repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cerca credenziali finite nel codice
        run: bash script/sniffa-segreti.sh .

  # -------------------------------------------------- GATE 2: dati
  dati:
    name: Gate dati - l'inventario rispetta le regole
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # TODO 2 - Aggiungi lo step che esegue il validatore dei dati:
      #            node script/valida-dati.mjs data/dispositivi.json
      #          Il validatore esce con 1 se trova un codice duplicato, uno stato
      #          non ammesso o una data scritta male: tanto basta perche' il job
      #          diventi rosso.

  # -------------------------------------------------- GATE 3: applicazione
  applicazione:
    name: Gate applicazione - dipendenze, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO 3 - Quattro step, in quest'ordine:
      #          a) prepara Node 20 sul runner (guarda come lo fa il job "dati")
      #          b) installa ESATTAMENTE le dipendenze dichiarate nel lockfile
      #             (non "npm install": il comando che rispetta il lockfile)
      #          c) esegui i test
      #          d) costruisci il sito
      #          Gli script sono gia' definiti in package.json.

      # TODO 4 - Smoke test sull'ARTEFATTO prodotto (non sul codice sorgente).
      #          Deve far fallire il job (exit 1) in TRE casi:
      #            - dist/index.html non esiste o e' vuoto
      #            - dist/stato.json non esiste o e' vuoto
      #            - il numero di righe dispositivo nella pagina e' diverso dal
      #              numero di dispositivi in data/dispositivi.json
      #          Ti servono, gia' pronti da copiare:
      #            attesi=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/dispositivi.json','utf8')).dispositivi.length)")
      #            trovati=$(grep -c '<tr class="disp">' dist/index.html || true)
      #          Stampa i due numeri: servono per lo screenshot.

