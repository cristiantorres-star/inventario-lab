# ---------------------------------------------------------------------------
#  CI - i controlli che girano su OGNI pull request.
#
#  Tre gate indipendenti: segreti, dati, applicazione. Se uno diventa rosso la
#  pull request non si puo' unire (main ha i required status checks).
#  Il gate applicazione guarda anche l'ARTEFATTO: test verdi sul codice non
#  bastano se poi la pagina generata perde un dispositivo.
# ---------------------------------------------------------------------------
name: CI

# TODO 1 - Su OGNI pull request verso main e sui push diretti a main.
#          workflow_dispatch resta per lanciarlo a mano quando serve.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -------------------------------------------------- GATE 1: segreti (ESEMPIO GIA' FATTO)
  segreti:
    name: Gate segreti - niente credenziali nel repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cerca credenziali finite nel codice
        run: bash script/sniffa-segreti.sh .

  # -------------------------------------------------- GATE 2: dati
  dati:
    name: Gate dati - l'inventario rispetta le regole
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # TODO 2 - Il validatore esce con 1 se trova un codice duplicato, uno
      #          stato non ammesso o una data scritta male: tanto basta perche'
      #          il job diventi rosso.
      - name: L'inventario rispetta le regole
        run: node script/valida-dati.mjs data/dispositivi.json

  # -------------------------------------------------- GATE 3: applicazione
  applicazione:
    name: Gate applicazione - dipendenze, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO 3 - Quattro step, in quest'ordine.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa le dipendenze del lockfile
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # TODO 4 - Smoke test sull'ARTEFATTO prodotto, non sul codice sorgente:
      #          se la pagina perde un dispositivo i test sul codice possono
      #          essere ancora verdi, questo controllo no.
      - name: Smoke test sull'artefatto
        run: |
          test -s dist/index.html || { echo "dist/index.html mancante o vuoto"; exit 1; }
          test -s dist/stato.json || { echo "dist/stato.json mancante o vuoto"; exit 1; }
          attesi=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/dispositivi.json','utf8')).dispositivi.length)")
          trovati=$(grep -c '<tr class="disp">' dist/index.html || true)
          echo "dispositivi nei dati: $attesi - righe nella pagina: $trovati"
          if [ "$trovati" -ne "$attesi" ]; then
            echo "la pagina generata non corrisponde a data/dispositivi.json"
            exit 1
          fi

      # TODO 5 - L'artefatto che la release scarichera', senza ricostruire.
      - name: Carica l'artefatto pacchetto
        uses: actions/upload-artifact@v4
        with:
          name: pacchetto
          path: dist/
          retention-days: 7
