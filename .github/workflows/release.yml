# ---------------------------------------------------------------------------
#  RELEASE - porta online l'inventario.
#
#  Il principio che questo file rispetta:
#  l'artefatto si costruisce UNA volta e si promuove. Chi va in produzione
#  SCARICA quell'artefatto, non ne costruisce un altro.
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    branches: [main]

  # TODO 6 - Partenza a mano = pulsante di ROLLBACK. Se l'input e' vuoto si
  #          pubblica HEAD di main, come fa il push.
  workflow_dispatch:
    inputs:
      sha_rollback:
        description: "SHA corto (7 caratteri) di una versione gia' collaudata da ripubblicare (vuoto = ultimo commit di main)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  # -------------------------------------------------- 1. costruisci UNA volta
  build:
    name: Costruisci e sigilla l'artefatto
    runs-on: ubuntu-latest
    outputs:
      versione: ${{ steps.versione.outputs.valore }}
    steps:
      - uses: actions/checkout@v4
        with:
          # tutta la storia del repository: senza, non potresti tornare indietro
          fetch-depth: 0

      # TODO 7 - Rollback: si torna al commit indicato PRIMA di costruire, cosi'
      #          l'etichetta di versione e il contenuto vengono da quel commit.
      #          Lo SHA va in git checkout: se lo passassi come ref: a
      #          actions/checkout verrebbe cercato fra branch e tag e il job
      #          morirebbe.
      - name: Torna alla versione da ripubblicare
        if: github.event_name == 'workflow_dispatch' && inputs.sha_rollback != ''
        run: |
          echo "Ripubblico la build ${{ inputs.sha_rollback }}"
          git checkout "${{ inputs.sha_rollback }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Prima si decide QUALE versione si sta costruendo, poi si costruisce:
      # cosi' anche in caso di rollback l'etichetta nella pagina e' quella giusta.
      - name: Calcola l'etichetta di versione
        id: versione
        run: |
          VALORE="$(git rev-parse --short=7 HEAD)"
          echo "valore=$VALORE" >> "$GITHUB_OUTPUT"
          echo "VERSIONE=$VALORE" >> "$GITHUB_ENV"
          echo "### Inventario lab - build \`$VALORE\`" >> "$GITHUB_STEP_SUMMARY"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: pacchetto
          path: dist/
          retention-days: 30

  # -------------------------------------------------- 2. collauda l'artefatto (GIA' FATTO)
  collaudo:
    name: Collaudo sull'artefatto, non sul codice
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pacchetto
          path: dist

      - name: La pagina esiste, non e' vuota e ha il foglio di stile
        run: |
          test -s dist/index.html || { echo "index.html mancante o vuoto"; exit 1; }
          test -s dist/style.css  || { echo "style.css mancante"; exit 1; }
          grep -q "Inventario laboratorio" dist/index.html || { echo "titolo non trovato"; exit 1; }
          echo "artefatto collaudato"

      - name: La versione dell'artefatto e' quella che ci aspettiamo
        run: |
          attesa="${{ needs.build.outputs.versione }}"
          trovata="$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/stato.json','utf8')).versione)")"
          echo "attesa: $attesa - trovata: $trovata"
          [ "$attesa" = "$trovata" ] || { echo "l'artefatto non e' quello costruito da questo run"; exit 1; }

  # -------------------------------------------------- 3. l'umano nel mezzo
  approvazione:
    name: Approvazione umana prima della produzione
    needs: [build, collaudo]
    runs-on: ubuntu-latest

    # TODO 8 - L'environment "live" (Settings > Environments) con i Required
    #          reviewers: e' questo che ferma il nastro e aspetta un umano.
    environment:
      name: live

    steps:
      - name: Registra chi ha approvato
        run: |
          echo "Release ${{ needs.build.outputs.versione }} approvata da ${{ github.actor }}"
          echo "### Approvata la release \`${{ needs.build.outputs.versione }}\` da @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------- 4. pubblica
  pubblica:
    name: Pubblica sul branch gh-pages
    runs-on: ubuntu-latest

    # TODO 9 - Solo dopo build, collaudo e approvazione, e serve il permesso di
    #          scrivere sul repository per spingere su gh-pages (solo lui: il
    #          resto del workflow resta in sola lettura).
    needs: [build, collaudo, approvazione]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # TODO 10 - Si promuove, non si ricostruisce: lo stesso artefatto
      #           collaudato, scaricato nella cartella che lo step qui sotto
      #           copia su gh-pages.
      - uses: actions/download-artifact@v4
        with:
          name: pacchetto
          path: uscita

      - name: Spingi il contenuto sul branch gh-pages
        run: |
          VERSIONE="${{ needs.build.outputs.versione }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp -r uscita/. .
          rm -rf uscita
          touch .nojekyll
          git add -A
          git commit -m "pubblica versione $VERSIONE"
          git push --force origin HEAD:gh-pages
          echo "### In produzione la versione \`$VERSIONE\`" >> "$GITHUB_STEP_SUMMARY"
